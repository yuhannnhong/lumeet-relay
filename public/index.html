<!doctype html>
<html lang="zh-Hant" data-platform="ios">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LUMEET" />
    <meta name="theme-color" content="#b77732" />
    <meta name="description" content="LUMEET 見妳 — 暖光裡，有我們的小家。" />
    <title>LUMEET｜見妳</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="platform.css" />
    <link rel="stylesheet" href="appearance.css" />
  </head>
  <body>
    <div class="desktop-atmosphere" aria-hidden="true"></div>
    <div id="app" class="app" data-theme="amber">
      <div class="scene" aria-hidden="true"></div>
      <div class="scene-tint" aria-hidden="true"></div>
      <div class="light-dust" aria-hidden="true"></div>
      <header id="header" class="topbar"></header>
      <main id="main"></main>
      <nav id="navigation" aria-label="主要導覽"></nav>
      <div id="toast" class="toast glass" role="status"></div>
      <dialog id="sheet" class="glass sheet">
        <div class="sheet-handle"></div>
        <button class="round sheet-close" aria-label="關閉" id="close-sheet"></button>
        <div id="sheet-content"></div>
      </dialog>
    </div>
    <script src="platform.js"></script>
    <script src="store.js"></script>
    <script src="ai.js"></script>
    <script src="home.js"></script>
    <script src="memory.js"></script>
    <script src="tools.js"></script>
    <script src="media.js"></script>
    <script src="music.js"></script>
    <script src="vad.js"></script>
    <script src="hearing.js"></script>
    <script src="voicecall.js"></script>
    <script src="wake.js"></script>
    <script src="help.js"></script>
    <script src="stickers.js"></script>
    <script src="backup.js"></script>
    <script src="onboarding.js"></script>
    <script src="appearance.js"></script>
    <script src="app.js"></script>
    <script src="light.js"></script>
  </body>
</html>
